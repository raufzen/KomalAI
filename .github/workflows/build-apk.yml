name: Build Komal AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Ensure Static Signing Keystore Exists
        run: |
          if [ ! -f app/keystore.jks ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore app/keystore.jks \
              -alias komalkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass komalai123 -keypass komalai123 \
              -dname "CN=Komal AI, OU=Assistant, O=Rauf Zen, L=Delhi, S=Delhi, C=IN"
            
            git config user.name "Rauf Zen"
            git config user.email "232077185+raufzen@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist static signing keystore for seamless app updates" || true
            git push origin main || true
          fi

      - name: Accept Android Licenses & Build Release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleRelease --stacktrace --no-daemon

      - name: Check Built APK Output
        run: |
          ls -lh app/build/outputs/apk/release/

      - name: Upload Komal AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomalAI-v1.1.0-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release v1.1.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Komal AI v1.1.0 (Signed Release APK)"
          body: |
            ### 📱 Komal AI v1.1.0 - Major Feature Update

            **🌟 What's New:**
            - 🔄 **Seamless In-Place App Updates**: Permanent static signing key allows updates without ever uninstalling the previous version.
            - 🔔 **In-App Auto-Update Checker**: Automatic update notification banner directly inside the app with 1-click install.
            - ⚡ **Offline Fast Mode**: Instant offline actions for WhatsApp, YouTube, Camera, Settings, and System Navigation without needing Gemini API.
            - 🎙️ **Gemini Native AI Voice Personas**: Realistic Google Gemini AI voices (`Aoede`, `Kore`, `Puck`, `Charon`, `Fenrir`) replacing robotic system TTS.
            - 🌐 **Hinglish + English Bilingual Support**: Choose between conversational Hinglish and English.
            - 🛠️ **Customizable UI & Floating Pill**: Sleek Material 3 design.

            📥 **Download `app-release.apk` below and install directly!**
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
