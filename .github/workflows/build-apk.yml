name: Build Komal AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Ensure Static Signing Keystore Exists
        run: |
          if [ ! -f app/keystore.jks ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore app/keystore.jks \
              -alias komalkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass komalai123 -keypass komalai123 \
              -dname "CN=Komal AI, OU=Assistant, O=Rauf Zen, L=Delhi, S=Delhi, C=IN"
            
            git config user.name "Rauf Zen"
            git config user.email "232077185+raufzen@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist static signing keystore for seamless app updates" || true
            git push origin main || true
          fi

      - name: Accept Android Licenses & Build Release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleRelease --stacktrace --no-daemon

      - name: Check Built APK Output
        run: |
          ls -lh app/build/outputs/apk/release/

      - name: Upload Komal AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomalAI-v1.1.0-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release v1.2.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Komal AI v1.2.0 (Gemini Native Audio, Hinglish/English & Independent Models)"
          body: |
            ### 📱 Komal AI v1.2.0 Release APK
            
            **🌟 What's New in v1.2.0:**
            - 🎙️ **100% Gemini AI Native Speech (ZERO robotic local TTS)**: Realistic voice output generated directly by Google Gemini API (`Aoede`, `Kore`, `Puck`, `Charon`, `Fenrir`).
            - 🌐 **Bilingual Support (Hinglish & English)**: Conversational Hinglish (default) and clean English. No forced Devanagari script.
            - 🧠 **Independent 3-Way Model Selection**:
              - 1. Phone Controller Brain Model
              - 2. Dedicated Voice Output & Speech Model
              - 3. Test Console Playground Model
            - 🎨 **New Custom Vector App Logo & Icon**: Glowing AI Orb launcher icon and UI branding.
            - ⚡ **Offline Zero-Latency Fast Actions**: Instant WhatsApp/YouTube/Home execution via Accessibility without calling Gemini API.
            - 🔄 **Seamless In-Place Updates**: Permanent signing key, no uninstall needed!
            
            📥 **Download `app-release.apk` below and install directly!**
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
